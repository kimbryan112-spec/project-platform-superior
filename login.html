<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Project Platform - Login</title>

    <link rel="shortcut icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/icons/Icon-1024.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="css/style.css?v=20260830-2">
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="login-logo">
            <img src="assets/images/kbhfilms-logo.png" alt="KBHFILMS Logo">
            <h2>PROJECT PLATFORM</h2>
        </div>

        <h1>Welcome Back</h1>
        <p class="login-subtitle">
            Sign in to continue.
        </p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- Login Error -->
            <p id="loginError" class="login-error"></p>

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="javascript:void(0);" id="createAccountLink">
                Create Account
            </a>
        </p>

    </div>
</div>

<!-- ITINAMA: Inalis ang js/script.js dito dahil para lamang ito sa Dashboard/Admin pages -->
<script src="js/login.js?v=20260830-2"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(reg => console.log("Service Worker registered:", reg.scope))
            .catch(err => console.error("Service Worker registration failed:", err));
    });
}
</script>

</body>
</html>
